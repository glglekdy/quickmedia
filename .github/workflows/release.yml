# v* 태그를 push 하면 설치 파일(QuickMedia-Setup-<버전>.exe)을 빌드해 GitHub 릴리즈로 올린다.
# 설치된 앱은 시작할 때 releases/latest 를 보고 새 설치 파일로 스스로 업데이트한다.
# 옛 유튜브 다운로더는 릴리즈의 첫 .exe 를 받으므로 exe 는 설치 파일 하나만 올린다.
# ffmpeg 는 설치 파일에 넣지 않고 ffmpeg-win64.zip 으로 함께 올린다. ffmpeg 가 없는 PC 에서 앱이 받아 간다.
#
# 릴리즈 설명은 release-notes/<태그>.md 를 쓴다. 없으면 빌드하지 않는다.
#
#   git tag v2.0.0 && git push origin v2.0.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 릴리즈 설명 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "release-notes/${{ github.ref_name }}.md")) {
            throw "release-notes/${{ github.ref_name }}.md 가 없어요. 업데이트 내용을 먼저 써 주세요."
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 버전 반영
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $toml = Get-Content Cargo.toml -Raw
          # [package] 의 version 줄만 바꾼다. 의존성의 version = "…" 은 줄 중간에 있다.
          $toml = [regex]::new('(?m)^version = "[^"]+"').Replace($toml, "version = `"$v`"", 1)
          [IO.File]::WriteAllText("$PWD/Cargo.toml", $toml)
          Select-String -Path Cargo.toml -Pattern '^version = ' | Select-Object -First 1

      - name: 시험
        run: cargo test

      - name: ffmpeg 받기
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          $exe = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          "FFMPEG=$exe" >> $env:GITHUB_ENV

      - name: yt-dlp 받기
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile yt-dlp.exe
          "YTDLP=$PWD\yt-dlp.exe" >> $env:GITHUB_ENV

      - name: Inno Setup 설치
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 빌드
        shell: pwsh
        run: ./build.ps1 -FFmpeg $env:FFMPEG -YtDlp $env:YTDLP

      - name: 릴리즈 올리기
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickMedia-Setup-*.exe
            dist/ffmpeg-win64.zip
          fail_on_unmatched_files: true
          # 설명은 사람이 쓴 업데이트 내용. 앱의 업데이트 화면에 그대로 보인다.
          body_path: release-notes/${{ github.ref_name }}.md
