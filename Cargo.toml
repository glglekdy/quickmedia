[package]
name = "quickmedia"
version = "2.0.0"
edition = "2021"
description = "QuickMedia"
publish = false

[lib]
name = "quickmedia"
path = "src/lib.rs"

[[bin]]
name = "QuickMedia"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
