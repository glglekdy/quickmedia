[package]
name = "quickmedia"
version = "2.0.0"
edition = "2021"
description = "QuickMedia"
publish = false

[lib]
name = "quickmedia"
path = "src/lib.rs"

[[bin]]
name = "QuickMedia"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "image-default-formats", "software-renderer-path"] }
rfd = { version = "0.15", default-features = false }
serde_json = "1"
sha2 = "0.10"
# TLS 는 Windows 것(schannel)을 써서 exe 를 작게 둔다
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "bmp"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
