[package]
name = "quickmedia"
version = "2.0.1"
edition = "2021"
description = "QuickMedia"
publish = false

[lib]
name = "quickmedia"
path = "src/lib.rs"

[[bin]]
name = "QuickMedia"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "image-default-formats", "software-renderer-path"] }
rfd = { version = "0.15", default-features = false }
serde_json = "1"
sha2 = "0.10"
# TLS 는 Windows 것(schannel)을 써서 exe 를 작게 둔다
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "bmp"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Globalization"] }
# zip 풀기만 쓴다(ffmpeg 받기). deflate 는 image 가 이미 쓰는 flate2 로.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

# 화면을 CPU 로 그리므로, 개발 빌드에서도 의존 크레이트는 최적화해 둔다(안 하면 움직임이 끊긴다)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# 그리는 쪽만 크기보다 속도를 우선한다
[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.i-slint-core]
opt-level = 3
